[package]
name = "spinel-cli"
version.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true

# The installed binary is `spinel`, so the package name stays `spinel-cli`
# while the command matches the protocol it speaks.
[[bin]]
name = "spinel"
path = "src/main.rs"

[dependencies]
bytes = { version = "1.5.0", features = ["serde"] }
clap = { version = "4.5.1", features = ["derive"] }
env_logger = "0.11.3"
futures = "0.3.30"
log = "0.4.21"
serialport = { version = "4.3.0", features = ["usbportinfo-interface"] }
spinel = { path = "../spinel", version = "0.2.0" }
tokio = { version = "1.36.0", features = ["rt", "bytes", "full"] }
tokio-serial = { version = "5.4.4", features = ["bytes", "codec"] }
tokio-util = "0.7.10"
